<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Spy Weber | Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080808;--panel:#151515;--red:#e50914;--muted:#aaa;--line:#303030}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px Arial,sans-serif;min-height:100vh}.wrap{max-width:900px;margin:48px auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:28px}.brand{font-size:25px;font-weight:800;letter-spacing:1px}.brand span{color:var(--red)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:25px;margin:18px 0}h1{font-size:26px;margin:0 0 8px}h2{font-size:19px;margin:0 0 18px}.muted{color:var(--muted)}label{display:block;margin:14px 0 7px;color:#ddd}input,select{width:100%;padding:13px;border-radius:7px;border:1px solid #444;background:#090909;color:#fff;font-size:15px}button,.link{display:inline-block;border:0;border-radius:7px;padding:12px 18px;background:var(--red);color:white;font-weight:700;cursor:pointer;text-decoration:none;margin-top:16px}button.secondary{background:#333}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.item{border-top:1px solid var(--line);padding:15px 0;display:flex;justify-content:space-between;gap:15px;align-items:center}.item small{display:block;color:var(--muted);margin-top:5px}.hidden{display:none}.status{margin-top:12px;color:#ff7777;white-space:pre-wrap}.status.ok{color:#75d68a}@media(max-width:600px){.wrap{margin:15px auto}.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="brand">THE SPY <span>WEBER</span> <small style="font-size:12px;color:#aaa">ADMIN</small></div><a class="link" href="../">View Website</a></header>
<section id="loginBox" class="panel"><h1>Admin Login</h1><p class="muted">Sign in with your existing administrator account.</p><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="Admin email"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="loginBtn">Login</button><div id="loginStatus" class="status"></div></section>
<section id="manager" class="hidden"><div class="panel"><h1>Video Manager</h1><p class="muted">Add a YouTube video to a category on the public website.</p><label>Video title</label><input id="title" placeholder="Enter video title"><div class="row"><div><label>Category</label><select id="sector"><option value="headtalk">Head Talk</option><option value="promo">Promo</option><option value="re-promo">Re-Promo</option><option value="re-pro">Re-Pro</option><option value="ai-editor">AI Editor</option><option value="cinematic">Cinematic</option><option value="motion">Motion</option></select></div><div><label>YouTube video URL or ID</label><input id="youtube" placeholder="https://www.youtube.com/watch?v=..."></div></div><button id="addBtn">Add Video</button><button id="logoutBtn" class="secondary">Logout</button><div id="managerStatus" class="status"></div></div>
<div class="panel"><h2>Uploaded Videos</h2><div id="videoList" class="muted">Loading videos…</div></div></section>
</main><script>
const SUPABASE_URL='https://inaazsmabgptpjckugwn.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_yBaRrATND_tJx4JXsIPAyA__LggH--V';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);function status(id,msg,ok=false){$(id).textContent=msg;$(id).className='status'+(ok?' ok':'')}
function getYoutubeId(value){value=value.trim();if(/^[\w-]{11}$/.test(value))return value;try{const u=new URL(value);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1).split('/')[0];if(u.searchParams.get('v'))return u.searchParams.get('v');const m=u.pathname.match(/\/embed\/([\w-]{11})/);return m?m[1]:null}catch{return null}}
async function showSession(){const {data:{session}}=await db.auth.getSession();$('loginBox').classList.toggle('hidden',!!session);$('manager').classList.toggle('hidden',!session);if(session)loadVideos()}
$('loginBtn').onclick=async()=>{status('loginStatus','Signing in…');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){status('loginStatus',error.message);return}status('loginStatus','Login successful',true);await showSession()};
$('logoutBtn').onclick=async()=>{await db.auth.signOut();$('manager').classList.add('hidden');$('loginBox').classList.remove('hidden')};
$('addBtn').onclick=async()=>{const title=$('title').value.trim(),sector=$('sector').value,youtube_id=getYoutubeId($('youtube').value);if(!title||!youtube_id){status('managerStatus','Enter a title and a valid YouTube URL or 11-character video ID.');return}status('managerStatus','Saving…');const {error}=await db.from('spyweber_videos').insert({title,sector,youtube_id});if(error){status('managerStatus',error.message);return}$('title').value='';$('youtube').value='';status('managerStatus','Video added successfully.',true);loadVideos()};
async function loadVideos(){const box=$('videoList');box.textContent='Loading…';const {data,error}=await db.from('spyweber_videos').select('id,title,sector,youtube_id,created_at').order('created_at',{ascending:false});if(error){box.textContent=error.message;return}if(!data.length){box.textContent='No videos added yet.';return}box.innerHTML='';for(const v of data){const item=document.createElement('div');item.className='item';const info=document.createElement('div');const strong=document.createElement('strong');strong.textContent=v.title;const small=document.createElement('small');small.textContent=v.sector+' · '+v.youtube_id;info.append(strong,small);const del=document.createElement('button');del.textContent='Delete';del.className='secondary';del.onclick=async()=>{if(!confirm('Delete this video?'))return;const {error}=await db.from('spyweber_videos').delete().eq('id',v.id);if(error){status('managerStatus',error.message);return}loadVideos()};item.append(info,del);box.append(item)}}
db.auth.onAuthStateChange((_event,session)=>{if(session)showSession()});showSession();
</script></body></html>
